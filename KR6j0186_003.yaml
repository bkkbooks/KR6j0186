body:
  text: 復次善男子何等名為海印陀羅尼門善男子如大海水印現一切謂四天下所有色相或衆生色相或非衆生色相山澤原阜樹木叢林藥草百穀日月星辰摩尼雲電村營聚落城邑王都及與諸天男女宮殿一切資具香林池沼渠河泉流綺麗嚴飾如是等類上中下品一切色相於大海中平等印現故説大海為第一印最勝妙印希奇殊特無等無過菩薩摩訶薩亦復如是住此海印甚深三昧得與一切衆生身平等印得與衆生語平等印得與衆生心平等印十方世界諸佛語業轉妙法輪菩薩皆從海印所流於口門中平等演説隨有所説皆與諸佛法印無違亦無疑惑能令法界一切衆生皆悉悟解故説此印諸印中上所謂婀上短字印者以一切法性無生故囉字印者以一切法無染著故跛字印者勝義諦門不可得故者字印者眼及諸行皆清淨故娜字印者名色性相不可得故攞字印者愛支因緣連續不斷皆不現故拏上聲字印者悟入清淨十力門故摩字印者力及菩提分皆清淨故拏上重字印者離諸怨敵及憂惱故灑字印者六通圓滿無罣礙故嚩字印者不二之道言語斷故多上聲字印者悟一切法真實義故也字印者稱如實理而演説故瑟吒二合字印者制伏任持不可得故迦上字印者遠離世論無作者故娑上字印者悟四真諦皆平等故莽輕呼字印者悟一切法清淨道故誐字印者入甚深法無行取故娑他上二合字印者顯示勢力不可得故惹字印者超過老死能所生故濕嚩二合字印者煩惱所行皆遠離故馱字印者法界體性不雜亂故捨字印者入深止觀皆滿足故佉字印者悟如虛空無盡法故乞叉二合字印者入於盡智無生智故娑上多也阿四合字印者遠離昏沈懈怠障故枳穰二合字印者一切衆生智慧體故賀字印者摧惡進善體皆離故婆上字印者慣習觀察覺悟體故者車上二合字印者遠離貪瞋癡覆性故娑莽二合字印者念不散動無忘失故訶婆上二合字印者可以呼召請命體故哆娑二合字印者勇猛驅逐諸惑體故伽上字印者散滅重雲無明翳故姹字印者積集諸行窮盡體故波羅二合字印者隨順最勝寂照體故頗字印者周遍圓滿果報體故娑迦上二合字印者悟解一切蘊聚體故也娑上二合字印者能除老死一切病故室者二合字印者現前覺悟未曾有故吒上字印者斷生死道得涅槃故瑟姹二合字印者悟解無邊無盡體故善男子菩薩以如是等種種法相分別演説諸字印門善男子是名深入海印三昧陀羅尼門復次善男子云何名為蓮華莊嚴陀羅尼門善男子菩薩住此陀羅尼門隨彼無量大會之中説妙法時即有廣大妙蓮花座涌現其前種種色相殊妙莊嚴其有見者情無厭足此座才現身便安處即於空中雨衆寶花種種花中出種種聲種種聲中説種種法所謂或甚深無量法或説善巧名句法或説種種諸譬喻門如是或説修多羅祇夜和伽羅那伽他搵陀那尼陀那本事本生方廣希法優波提舍説如是等十二分教及種種門皆為斷除一切衆生諸煩惱故而菩薩心安住大捨寂然正受即能等引如是音聲説法不斷滅衆生苦作諸佛事又於菩薩遍身毛孔出種種光一一光中出生種種妙寶蓮華一一花上有一菩薩遍往十方無量無邊諸世界中而作佛事是為初入蓮華莊嚴陀羅尼門若廣説者不可窮盡復次善男子云何名為能入無著陀羅尼門善男子菩薩住此陀羅尼門於一法門心無所著如是若二若三若十若百若千若百千若俱胝若那由他乃至阿僧祇無量無邊無等不可數不可稱不可思不可量不可説法門皆心平等而無所著或恆河沙法門亦皆平等心無所著如是閻浮提微塵數法門四天下微塵數法門三千大千世界微塵數法門亦無所著若一佛剎若十佛剎若百若千若恆河沙佛剎微塵數法門乃至一切佛剎微塵數法門亦皆平等心無所著若説一門攝如上説一切佛剎塵數法門皆入一門一時演説如於一門若二若三乃至無量無邊法門亦皆如是一一門中攝一切門一時演説如是説時心無所著亦無所住利益安樂一切衆生其義深遠稱如實理次第無亂文義具足善男子是名能入無著陀羅尼門復次善男子云何名為漸漸深入四無礙智陀羅尼門善男子若諸菩薩安住於此陀羅尼門得微細差別法門無盡智得微細甚深義門無盡智得微細詞門無盡智得微細無邊辨門無盡智得是智故東方所有一切衆生同一道場各隨類音善巧方便而問其法南方所有一切衆生同一道場各隨類音善巧方便而問其義西方所有一切衆生同一道場各隨類音善巧方便而問其詞北方所有一切衆生同一道場各隨類音善巧方便而問其辨如是四方一切衆生一時發問種種法門菩薩一念悉能領受心無錯亂明記無失於一語業出種種音一一音聲説一切法隨諸衆生種類不同所樂各異皆得領解踊躍歡喜心願滿足善男子是為菩薩漸漸深入四無礙智陀羅尼門復次善男子云何名為諸佛護持莊嚴陀羅尼門善男子菩薩得此陀羅尼故於大會中處大法座於其肉髻最處中心頂骨交際忽現如來身鎔金色相好莊嚴而以右手摩菩薩頂即時菩薩便得色身相好莊嚴具足圓滿與佛平等又得如來語業莊嚴具足圓滿又得如來意業莊嚴具足圓滿得如是等種種佛法具足圓滿既得是已隨此大會一切衆生心界不同欲樂差別所疑有異説種種法或一日夜或二或三半月一月一年百年或百千年隨其心樂久近多少常説妙法無有窮盡如是説時不飲不食不羸不瘦身心無倦以是如來威德護持難思力故菩薩又得四種大智云何為四所謂微細了知衆生心行各差別智微細分別一切諸法無窮盡智善能分別三乘修行諸次第智具足圓滿隨順堪任演説法智善男子是名略説諸佛護持莊嚴陀羅尼門若廣説者無量無邊等虛空界無有窮盡與如來等皆為利益諸衆生故善男子是為八種陀羅尼門若有菩薩安住此八陀羅尼門則能總持一切如來及諸菩薩所説妙法令諸菩薩辨才無盡一切衆生若有聞者愛樂歡喜情無厭足爾時一切法自在王菩薩聞此法已心懷踊躍以偈讚曰善逝説八總持法決定令得微妙乘演百千億修多羅於義及文無所著大聲清淨無邊際百千無量剎皆聞能成衆生寂靜心是名大聲清淨義一字演説一切法多劫無有窮盡時一一字門亦復然此住寶篋真言地遠離諸邊得清淨平等無著同如來剎那正念煩惱除是名法義漩澓處四天下中諸色相大海印現並無遺説此無思無盡門是名海印真言德具大人相處大衆坐蓮華座雨天花花演俱胝妙法門蓮華莊嚴總持用入一句法無所著億剎微塵句亦然句句演暢難思門無著總持皆自在具足法義及詞辨四方衆生齊啓疑自他疑網皆斷除此是四辨總持力菩薩升於大法座頂上現佛如金山即舒右手相端嚴殷重摩於菩薩頂獲微妙辨同於佛此名護念佛莊嚴得入最勝總持門便獲難思無盡德如蓮不染於三界五塵不動等須彌得此最勝陀羅尼無等智超三界轉能師子吼無所畏摧諸外道碎邪山得此最勝陀羅尼遠離受生諸業果如地生長諸善法如水滌垢淨無餘如火焚燒不擇薪如風飄鼓無所住如醫善知於法藥除衆生病得安寧得此最勝陀羅尼智演諸法無傾動如月圓明淨無點流光普照等無私得此最勝陀羅尼衆會見者無厭足如日光輪平等照破生死暗覺群迷得此最勝陀羅尼能除有情諸渴愛如轉輪王教十善如毗沙門富法財得此最勝陀羅尼慈念衆生降法雨如龍興雲現威德震雷曜電並無思得此最勝陀羅尼寂靜無心無執著莊嚴微妙如帝釋大智隨機演法門得此最勝陀羅尼猶如牛王處大衆如大梵王住慈定遍觀世界盡超過得此最勝陀羅尼常得五通無退轉遍遊法界難思剎如梵天王遍梵宮得此最勝陀羅尼供養十方諸佛海諸佛共觀如長子同時稱讚德難思得此最勝陀羅尼不久獲佛諸功德辨才廣博無窮盡演説深廣修多羅得此最勝陀羅尼妙辨如鬘無斷絶智慧聰明無妄念無邊方便同虛空得此最勝陀羅尼憍慢諂詐皆除斷定慧雙流無斷絶慈悲俱起不相離得此最勝陀羅尼永斷世間諸過失善知衆生語言法心行根欲悉無餘得此最勝陀羅尼説法纖毫無誤失念處正斷及神足根力覺道定皆圓得此最勝陀羅尼便獲殊妙淨法智隨順諸度到彼岸通達四攝無有餘得此最勝陀羅尼能知善逝諸境界自然近佛深寂靜建立萬行調衆生得此最勝陀羅尼於一切時無錯亂獲得無垢蘊界入處胎不染不無知得此最勝陀羅尼見佛如蓮心不著三業恆隨智慧轉動寂無礙利衆生得此最勝陀羅尼説法常蒙諸佛護大智能作衆生主多劫讚歎不能窮爾時世尊稱讚一切法自在王菩薩言善哉善哉善男子汝能讚説此陀羅尼如諸佛説等無有異我今隨喜善男子今此會中有六十億那由他出家菩薩及與無數百千萬億在家菩薩聞此陀羅尼門皆得無生法忍無量天龍夜叉乾闥婆阿修羅迦樓羅緊那羅摩睺羅伽人非人比丘比丘尼優婆塞優婆夷等皆於阿耨多羅三藐三菩提得不退轉守護國界主陀羅尼經大悲胎藏出生品第三爾時文殊師利菩薩摩訶薩即從座起偏袒右肩右膝著地為佛作禮合掌恭敬而白佛言世尊如佛所説心及虛空陀羅尼菩提無二無別皆以大悲為其根者而此大悲復以何法而為根本佛告文殊師利菩薩言善哉善哉善男子快發斯問為欲利樂多衆生故諦聽諦聽善思念之吾當為汝分別解説善男子此大悲根復以衆生受苦為本文殊師利復白佛言世尊衆生受苦復以何法而為其本佛言從煩惱生又問煩惱以何為本佛言從於種種顛倒邪見而生又問種種顛倒邪見以何為本佛言從虛妄分別生又問虛妄分別以何為本佛言此妄分別無有根本無有色相難知難斷善男子以是義故菩薩摩訶薩為諸衆生起大悲心勞謙忘倦譬如甘蔗及以胡麻以物壓之漿油便現菩薩亦爾大悲深重復起十六大悲之心作是念言傷哉衆生常為身見之所繫縛種種邪見以為窟宅我當為彼演説妙法悉令除斷傷哉衆生於斷於常執著建立文殊師利白佛言世尊云何名為斷見常見佛言善男子言斷見者布施供養皆無果報善行惡行此世後世皆無有果父母變化皆悉斷無何以故譬知燒木已成其灰終無生理是名斷見言常見者王常為王貴常為貴貧富男女端正醜陋象馬等類常無改易何以故譬如種子隨其本類各別生芽終無雜亂善男子此等衆生作如是見皆無果報菩薩為彼起大悲心開示演説緣起之門令其信入因緣果報菩薩復念傷哉衆生起四顛倒無常計常無樂計樂無我計我無淨計淨我當為彼説甚深法令除顛倒傷哉衆生於其無我無我所中計我我所我當為説微妙之法令其除斷我我所見傷哉衆生為諸蓋障之所覆蔽貪箭中心瞋火熾盛身心俱焚昏沈睡眠之所迷醉掉舉惡作纏繞不捨於甚深法常懷疑惑我當為説微妙之法令其隳裂諸蓋之網傷哉衆生戀著六處眼才見色隨色名相而生執著耳聞音聲鼻嗅香臭舌嘗滋味身觸細滑意分別法皆隨名相而生執著我當為説深妙之法令不樂著六處空聚傷哉衆生多起諸慢為慢過慢及慢過慢我慢增上慢卑慢邪慢云何為慢謂於下劣衆生計我勝彼言過慢者於己等者言我過彼慢過慢者於他勝己計我勝彼言我慢者於色計我乃至於識亦計於我令心高舉言增上慢者增上聖法曾未獲得向他人説我得聖法言卑慢者於彼多分勝己之人言我少劣言邪慢者於己邪見無德之中謂己為正翻詔他人以之為邪如是等慢我當為彼説甚深法令其除斷住於平等傷哉衆生趣向邪道遠離聖道我當為説正道之法令遠邪徑傷哉衆生為恩愛奴受其驅策妻妾男女以為枷鎖杻械繫縛染著耽味不能捨離令身口意不得自在我當為彼説離貪法令其三業動止無傷哉衆生更相鬪諍瞋恚結恨互為怨讎當為説法令其除斷傷哉衆生遠善知識隨逐惡友不相捨離如指與甲和合相依造諸惡業無暫休息當為説法令捨惡友近善知識傷哉衆生貪求名利無有厭足如海吞流得之彌盛如火益薪遠離無垢實相智慧我當為説真實之法令斷名利獲清淨智傷哉衆生無明黑暗無我法中橫起我見衆生壽命補特伽羅當為説法斷除如是種種邪見令去翳膜開淨智眼傷哉衆生生死牢獄輪回禁繫五蘊怨賊之所殺害當為説法令出三界傷哉衆生為魔羂索之所繫縛五欲纏繞不得出離我當為説超魔之法令絶魔羂斷五欲纏傷哉衆生閉涅槃門開生死路當為説法令閉三惡入涅槃門善男子是為菩薩摩訶薩起十六種大悲之心爾時世尊復告文殊師利童子菩薩言善男子此大悲門即是一切菩薩之母菩薩住是大悲之中即能建立三十二種不共事業日夜勤修速得圓滿云何名為三十二種不共事業所謂菩薩若見一切愚癡重暗長眠大夜無智衆生便以智慧先自覺察復以智慧覺悟一切愚癡衆生是名菩薩第一不共事業若見衆生愛樂二乘其心狹劣菩薩便起廣大之心令其安住大乘法中是名菩薩第二不共事業若見衆生愛樂非法縱恣三業無善法欲菩薩自住正法園苑復令衆生住正法中是名菩薩第三不共事業若見衆生邪命自活矯詐貪求先以自身住於正命復令衆生安住正命清淨法中是名菩薩第四不共事業若見衆生撥無因果及一切法起大邪見自住正見復令衆生安住無垢正見法中是名菩薩第五不共事業若見衆生無知惡念積集煩惱自以智眼安心正念復令衆生住於正念破無知暗開智慧明是名菩薩第六不共事業若見衆生棄捨正法住不正法先自安住正法之中復令衆生解了正法是名菩薩第七不共事業若見衆生慳吝所覆菩薩自身起無慳心一切皆捨復令衆生勤修捨行是為菩薩第八不共事業若見衆生毀犯淨戒於表無表不能遵行便以淨戒莊嚴其身復令衆生堅持淨戒是名菩薩第九不共事業若見衆生瞋恨熾然蘊積諸惡以慈忍力而自莊嚴復令衆生安住此法是名菩薩第十不共事業若見衆生身心懈怠遠離精進自以精進甲胄嚴身復令衆生捨懈怠心勤勇不惰是名菩薩第十一不共事業若見衆生散亂妄念菩薩自住三摩呬多寂靜觀察亦令衆生捨亂住定是名菩薩第十二不共事業若見衆生惡慧無智便以智慧而自莊嚴復令衆生捨離惡慧具足般若波羅蜜多是名菩薩第十三不共事業若見衆生非理作意行於邪道菩薩即以善巧方便如理思惟亦令衆生捨於非理安住正道是名菩薩第十四不共事業若見衆生昏亂無知煩惱所害菩薩自住隨念分別種種分別微細分別一切境界遠離煩惱復令衆生斷除煩惱住正法中是名菩薩第十五不共事業若見衆生身見有見牢獄所繫而以智慧了達自身不為見縛復令衆生遠離身見不計於有住正智慧是名菩薩第十六不共事業若見衆生諸根縱蕩馳流境界不能制伏而自柔和心無放逸復令衆生安住律儀善守根門三業調順是名菩薩第十七不共事業若見衆生無慚無愧不知恩報斷滅善根便以慚愧而自莊嚴知恩知報修諸善根復為衆生説法開示令具慚愧能知恩德圓滿善根是名菩薩第十八不共事業若見衆生為大瀑水波浪所沒隨業漂溺不能勉出菩薩自現越渡瀑流到於彼岸復令衆生斷除惡業越生死流到涅槃岸是名菩薩第十九不共事業若見衆生剛強難化而以自身謙卑仁讓承順師長復令衆生安住謙敬是名菩薩第二十不共事業若見衆生心懷嫉妬於修善者多生障礙便以善根自嚴其身復令衆生捨離猜忌障礙之心安住正法是名菩薩第二十一不共事業若見衆生貧窮困苦復無法財菩薩示有資生無量具七聖財復令衆生無所乏少住聖財中是名菩薩第二十二不共事業若見衆生長嬰病苦四大毒蛇互相違反傷害身心菩薩即以無病功德而自莊嚴復置衆生無諸病惱安樂法中是名菩薩第二十三不共事業若見衆生愚癡無智遠智光明菩薩便以智慧光明自嚴其身復令衆生安住無癡智慧法中是名菩薩第二十四不共事業若見衆生樂著三界穢惡深坑輪回五道菩薩巧能自出三界復以善巧出三界道運諸衆生是名菩薩第二十五不共事業若見衆生違背正道行於邪徑自安正法復令衆生住正法中是名菩薩第二十六不共事業若見衆生愛著身命嚴飾資養冀其長存不知此身無常不淨無有慚愧不知恩德菩薩便現厭惡自身棄捨榮好復令衆生觀察無常生厭離想是名菩薩第二十七不共事業若見衆生遠佛法僧菩薩自身紹三寶種復令衆生紹佛法僧使不斷絶是為菩薩第二十八不共事業若見衆生退失善法菩薩便以善法嚴身復令衆生住善法中是名菩薩第二十九不共事業若見衆生遠離師長不行六念菩薩則以六念自嚴復令衆生常修六念如實觀智是名菩薩第三十不共事業若見衆生業煩惱網之所縈覆菩薩便現裂業惑網亦令衆生絶生死因安住正法是名菩薩第三十一不共事業若見衆生具諸不善遠離善根菩薩便自蠲除諸惡具善莊嚴復令衆生具足善根遠離不善是名菩薩第三十二不共事業善男子是為菩薩三十二種不共事業若諸菩薩安住此業一切善法恆自增長具足圓滿復次善男子菩薩復有無量事業何以故謂衆生無邊衆生煩惱亦復如是無量無邊菩薩隨彼一切衆生煩惱差別亦説無邊解脫門故善男子假使恆河沙數世界滿中衆生所有之行或聲聞行或緣覺行所有事業比此菩薩最初所發菩提之心所有事業百分不及一千分不及一如是百千分俱胝分百俱胝分千俱胝分算分歌羅分數分喻分優波尼沙陀分皆不及一何以故二乘自為斷除煩惱菩薩事業不為自身普為除斷一切衆生諸煩惱故是故菩薩所有事業比於二乘最為殊勝所得功德無量無邊何以故凡夫衆生所修事業皆與一切顛倒相應二乘所作其心狹劣菩薩事業遠離顛倒無量無邊是故菩薩所得功德亦復如是無量無邊以是義故超過一切凡夫二乘爾時文殊師利菩薩聞是法已踊躍歡喜遍身怡暢心得清涼而作是言希有世尊希有世尊善能分別甚深微妙菩薩種種陀羅尼門大悲之門及與不共事業之門我聞佛説歡喜頂受如法奉行
